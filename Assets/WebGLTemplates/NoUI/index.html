<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KeyBoard1015</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; overflow: hidden; }
      /* 加载期为白底过渡，场景就绪后由引擎自行绘制 */
      #unity-canvas { width: 100%; height: 100%; display: block; background: #fff; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // 极简启动：无 Unity logo、无进度条、无底部商标栏/全屏按钮。
      // 三花括号占位符由构建时自动填入（兼容 .unityweb 等压缩后缀）
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      });
    </script>
  </body>
</html>
